name: Run R Pipeline + Deploy Shiny

on:
  push:
    branches: [main]

  schedule:
    # Runs daily at 7 AM UTC
    - cron: '0 13 * * 1,3,5'

  workflow_dispatch:  # optional manual trigger

permissions:
   contents: read

jobs:
  run-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install system dependencies
        run: |
            sudo apt-get update
            sudo apt-get install -y \
              libcurl4-openssl-dev \
              libssl-dev \
              libxml2-dev \
              libgdal-dev \
              libgeos-dev \
              libproj-dev \
              libudunits2-dev \
              libuv1-dev

      # - name: Install R dependencies
      #   run: |
      #     Rscript -e 'install.packages(c(
      #     "remotes",
      #     "rsconnect",
      #     "shiny",
      #     "tidyverse",
      #     "plotly",
      #     "leaflet",
      #     "gt",
      #     "bsicons",
      #     "bslib",
      #     "lubridate",
      #     "readr",
      #     "forcats",
      #     "httr2",
      #     "jsonlite",
      #     "xml2",
      #     "cpp11",
      #     "progress"
      #     ), repos="https://cloud.r-project.org")'

      - name: Install R packages
        run: |
          Rscript -e '
            pkgs <- c(
              "remotes", "rsconnect", "shiny", "tidyr", "dplyr", "purrr",
              "plotly", "tibble",
              "leaflet", "gt", "bsicons", "bslib", "lubridate", "readr",
              "forcats", "httr2", "jsonlite", "xml2", "cpp11", "progress"
              )
            install.packages(pkgs)
            missing <- pkgs[!pkgs %in% rownames(installed.packages())]
            if (length(missing)) {
            stop("Failed to install: ", paste(missing, collapse = ", "))
            }
            '


      # Pin versions known to work locally
      - name: Pin deployment packages
        run: |
          Rscript -e 'remotes::install_version("terra", version = "1.9-11", dependencies = FALSE, upgrade = "never")'


      - name: Verify terra version before deploy
        run: |
          Rscript -e 'v <- as.character(packageVersion("terra")); cat("terra:", v, "\n");
          if (v != "1.9.11") stop("terra is not 1.9-11; aborting deploy to avoid GDAL build failure")'
          Rscript -e 'cat("leaflet:", as.character(packageVersion("leaflet")), "\n")'
          Rscript -e 'cat("rsconnect:", as.character(packageVersion("rsconnect")), "\n")'

      - name: Run data pipeline scripts
        env:
          APP_USERNAME: ${{ secrets.APP_USERNAME }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          Rscript run_all.R

      - name: Deploy to shinyapps.io
        env:
          SHINYAPPS_NAME: ${{ secrets.SHINYAPPS_NAME }}
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
          GITHUB_PAT: ${{ secrets.GH_TOKEN }}
        run: |
          Rscript -e '

            library(rsconnect);

            rsconnect::setAccountInfo(
              name = Sys.getenv("SHINYAPPS_NAME"),
              token = Sys.getenv("SHINYAPPS_TOKEN"),
              secret = Sys.getenv("SHINYAPPS_SECRET")
            );

            rsconnect::deployApp(appDir = "app",
            appName = "weekly-hydrometric-app",
            forceUpdate = TRUE,
            logLevel = "verbose")
          '
